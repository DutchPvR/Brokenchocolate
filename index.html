<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>broken chocolate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #1a0630 0%, #000 60%);
    background-size: 200% 200%;
    animation: haze 14s ease-in-out infinite alternate;
  }
  h1 {
    margin: 0; padding: 0 16px; text-align: center;
    font-family: "Rubik Wet Paint", cursive; font-weight: 400;
    font-size: clamp(2.5rem, 11vw, 7rem);
    color: #fff;
    filter: url(#water);
    animation: glow 8s ease-in-out infinite alternate;
  }
  @keyframes glow {
    0%   { color: #fff;    text-shadow: 0 0 12px #8a2be2aa, 0 0 40px #6a0dad66; }
    50%  { color: #e6d0ff; text-shadow: 0 0 20px #b266ffcc, 0 0 70px #8a2be288; }
    100% { color: #c9a0ff; text-shadow: 0 0 16px #da70d6aa, 0 0 55px #9932cc77; }
  }
  @keyframes haze {
    from { background-position: 40% 45%; }
    to   { background-position: 60% 55%; }
  }
  @media (prefers-reduced-motion: reduce) {
    body, h1 { animation: none; }
    h1 { filter: none; text-shadow: 0 0 16px #8a2be2aa; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="water" x="-10%" y="-20%" width="120%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.03" numOctaves="2" seed="7" result="noise">
      <animate attributeName="baseFrequency" dur="16s" repeatCount="indefinite"
               values="0.008 0.03; 0.012 0.045; 0.006 0.025; 0.008 0.03"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<h1>broken chocolate</h1>
</body>
</html>
